[project]
name = "brasaland-monorepo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3,<4",
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "markitdown[pdf]>=0.1.9",
    "matplotlib>=3.11.2",
    "mcpauth==0.2.0b1",
    "openai>=3.41.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.9",
    "py-readability-metrics>=1.4.5",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Los tests del monorepo Python viven en tests/; `scripts/test_analyze.py` (Hito 5) se ejecuta aparte.
testpaths = ["tests"]
pythonpath = ["."]
