[project]
name = "brasaland-api"
version = "0.1.0"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "tinydb>=4.8,<5",
  "python-jose[cryptography]>=3.5.0",
  "libpass[bcrypt]>=1.9.3",
  "python-dotenv>=1.2.3",
  "email-validator>=2.3.0",
  "resend>=2.0,<3",
]

[project.scripts]
seed = "app.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
]
